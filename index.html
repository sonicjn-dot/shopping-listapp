<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쇼핑 리스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-size: 28px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #itemInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #itemInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #addButton {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        #addButton:hover {
            background: #5568d3;
        }

        #addButton:active {
            transform: scale(0.98);
        }

        .shopping-list {
            list-style: none;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .shopping-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .shopping-item.checked {
            opacity: 0.6;
        }

        .shopping-item.checked .item-text {
            text-decoration: line-through;
            color: #999;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .item-text {
            flex: 1;
            font-size: 16px;
            color: #333;
            word-break: break-word;
        }

        .delete-button {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .delete-button:hover {
            background: #c82333;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 16px;
        }

        .stats {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 쇼핑 리스트</h1>

        <div class="input-section">
            <input
                type="text"
                id="itemInput"
                placeholder="아이템을 입력하세요..."
                autocomplete="off"
            >
            <button id="addButton">추가</button>
        </div>

        <ul class="shopping-list" id="shoppingList">
            <div class="empty-message">아이템을 추가해보세요!</div>
        </ul>

        <div class="stats" id="stats">
            전체: 0개 | 완료: 0개
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Supabase 클라이언트 초기화
        const supabaseUrl = 'https://wegojcqcodhaszlxvsgw.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlZ29qY3Fjb2RoYXN6bHh2c2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3MDc5NjYsImV4cCI6MjA4NjI4Mzk2Nn0.tV8MvvkR-8t4Ed5QHw2Nkbtyqwp6ZdLnYGVDBnsDdzU';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // DOM 요소
        const itemInput = document.getElementById('itemInput');
        const addButton = document.getElementById('addButton');
        const shoppingList = document.getElementById('shoppingList');
        const stats = document.getElementById('stats');

        // 전역 아이템 배열
        let items = [];

        // 초기 로드
        loadItems();

        // 이벤트 리스너
        addButton.addEventListener('click', addItem);
        itemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addItem();
            }
        });

        // Supabase에서 아이템 로드
        async function loadItems() {
            try {
                const { data, error } = await supabase
                    .from('shopping_items')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                items = data || [];
                renderList();
            } catch (error) {
                console.error('아이템 로드 실패:', error);
                alert('데이터를 불러오는데 실패했습니다.');
            }
        }

        // 아이템 추가
        async function addItem() {
            const text = itemInput.value.trim();

            if (text === '') {
                alert('아이템을 입력해주세요!');
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('shopping_items')
                    .insert([{ text: text, checked: false }])
                    .select();

                if (error) throw error;

                items.unshift(data[0]);
                renderList();
                itemInput.value = '';
                itemInput.focus();
            } catch (error) {
                console.error('아이템 추가 실패:', error);
                alert('아이템 추가에 실패했습니다.');
            }
        }

        // 아이템 삭제
        async function deleteItem(id) {
            try {
                const { error } = await supabase
                    .from('shopping_items')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                items = items.filter(item => item.id !== id);
                renderList();
            } catch (error) {
                console.error('아이템 삭제 실패:', error);
                alert('아이템 삭제에 실패했습니다.');
            }
        }

        // 아이템 체크/언체크
        async function toggleItem(id) {
            const item = items.find(item => item.id === id);
            if (!item) return;

            try {
                const newChecked = !item.checked;
                const { error } = await supabase
                    .from('shopping_items')
                    .update({ checked: newChecked })
                    .eq('id', id);

                if (error) throw error;

                item.checked = newChecked;
                renderList();
            } catch (error) {
                console.error('아이템 업데이트 실패:', error);
                alert('아이템 업데이트에 실패했습니다.');
            }
        }

        // 리스트 렌더링
        function renderList() {
            if (items.length === 0) {
                shoppingList.innerHTML = '<div class="empty-message">아이템을 추가해보세요!</div>';
                updateStats();
                return;
            }

            shoppingList.innerHTML = items.map(item => `
                <li class="shopping-item ${item.checked ? 'checked' : ''}" data-id="${item.id}">
                    <input
                        type="checkbox"
                        class="checkbox"
                        ${item.checked ? 'checked' : ''}
                        onchange="window.toggleItem(${item.id})"
                    >
                    <span class="item-text">${escapeHtml(item.text)}</span>
                    <button class="delete-button" onclick="window.deleteItem(${item.id})">삭제</button>
                </li>
            `).join('');

            updateStats();
        }

        // 통계 업데이트
        function updateStats() {
            const total = items.length;
            const completed = items.filter(item => item.checked).length;
            stats.textContent = `전체: ${total}개 | 완료: ${completed}개`;
        }

        // HTML 이스케이프 (XSS 방지)
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 전역 함수로 노출 (HTML onclick 이벤트에서 사용)
        window.deleteItem = deleteItem;
        window.toggleItem = toggleItem;
    </script>
</body>
</html>
